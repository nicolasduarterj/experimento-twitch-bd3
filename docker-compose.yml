services:
  mongodb:
    image: mongo:7.0.34
    container_name: bench_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: twitch
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.26.26-community-ubi10
    container_name: bench_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/benchmark123
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
    volumes:
      - neo4j_data:/data
  
  postgresql:
    image: postgres:18.4
    container_name: bench_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: twitch
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark123
    volumes:
      - postgres_data:/var/lib/postgresql

  scylladb:
    image: scylladb/scylla:5.4
    container_name: bench_scylla
    ports:
      - "9042:9042"
      - "9160:9160"
    # --smp controls how many cores ScyllaDB uses; match to available CPUs
    # --memory caps RAM usage; --overprovisioned suits a shared benchmark host
    command: --smp 20 --overprovisioned 1 --rpc-address 0.0.0.0 --broadcast-rpc-address 127.0.0.1
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q UN"]
      interval: 30s
      timeout: 15s
      retries: 12

volumes:
  mongo_data:
  neo4j_data:
  postgres_data:
  scylla_data:
